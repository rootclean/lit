<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Письмо Пульхерии Александровны сыну">
  <rect width="800" height="600" fill="#fbf6ec"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#ded2bd" stroke-width="1.5"/>
  <rect x="27" y="27" width="746" height="546" fill="none" stroke="#ece1cd" stroke-width="1"/>

  <!-- лист письма -->
  <g transform="rotate(-1.6 400 300)">
    <rect x="110" y="104" width="580" height="392" fill="#fffdf6" stroke="#ded2bd" stroke-width="1.4"/>
    <rect x="120" y="114" width="560" height="372" fill="none" stroke="#f0e6d4" stroke-width="1"/>
    <line x1="110" y1="300" x2="690" y2="300" stroke="#efe4d0" stroke-width="1"/>

    <text x="150" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3" fill="#8c3a2a">ПИСЬМО МАТЕРИ</text>
    <text x="150" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="1" fill="#7a6f5e">Ч. 1, ГЛ. 3</text>

    <g font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#2b241c">
      <text x="150" y="238">«Ты знаешь, как я люблю тебя;</text>
      <text x="150" y="272">ты один у нас, у меня и у Дуни,</text>
      <text x="150" y="306">ты наше всё, вся надежда,</text>
      <text x="150" y="340">упование наше».</text>
    </g>

    <g stroke="#cfc2a8" stroke-width="1" opacity="0.8">
      <line x1="150" y1="384" x2="520" y2="384"/>
      <line x1="150" y1="404" x2="470" y2="404"/>
      <line x1="150" y1="424" x2="560" y2="424"/>
      <line x1="150" y1="444" x2="380" y2="444"/>
    </g>
  </g>

  <text x="640" y="556" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#6f6555">Твоя мать</text>
</svg>
