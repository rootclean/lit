<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Пятиэтажный дом, каморка Раскольникова под самою кровлей">
  <rect width="800" height="600" fill="#fbf6ec"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#ded2bd" stroke-width="1.5"/>
  <rect x="27" y="27" width="746" height="546" fill="none" stroke="#ece1cd" stroke-width="1"/>

  <text x="400" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3" fill="#2b241c">ДОМ И КАМОРКА</text>
  <line x1="330" y1="92" x2="470" y2="92" stroke="#b08a52" stroke-width="1.5"/>

  <!-- кровля -->
  <path d="M170 150 L330 92 L490 150" fill="none" stroke="#2b241c" stroke-width="2"/>
  <!-- корпус -->
  <rect x="180" y="150" width="300" height="330" fill="#f7efdf" stroke="#2b241c" stroke-width="2"/>
  <!-- этажи -->
  <line x1="180" y1="216" x2="480" y2="216" stroke="#2b241c" stroke-width="1.2"/>
  <line x1="180" y1="282" x2="480" y2="282" stroke="#2b241c" stroke-width="1.2"/>
  <line x1="180" y1="348" x2="480" y2="348" stroke="#2b241c" stroke-width="1.2"/>
  <line x1="180" y1="414" x2="480" y2="414" stroke="#2b241c" stroke-width="1.2"/>

  <!-- окна -->
  <g fill="none" stroke="#8b8175" stroke-width="1.2">
    <rect x="205" y="164" width="34" height="38"/><rect x="262" y="164" width="34" height="38"/><rect x="319" y="164" width="34" height="38"/><rect x="376" y="164" width="34" height="38"/><rect x="433" y="164" width="34" height="38"/>
    <rect x="205" y="230" width="34" height="38"/><rect x="262" y="230" width="34" height="38"/><rect x="319" y="230" width="34" height="38"/><rect x="376" y="230" width="34" height="38"/><rect x="433" y="230" width="34" height="38"/>
    <rect x="205" y="296" width="34" height="38"/><rect x="262" y="296" width="34" height="38"/><rect x="319" y="296" width="34" height="38"/><rect x="376" y="296" width="34" height="38"/><rect x="433" y="296" width="34" height="38"/>
    <rect x="205" y="362" width="34" height="38"/><rect x="262" y="362" width="34" height="38"/><rect x="319" y="362" width="34" height="38"/><rect x="376" y="362" width="34" height="38"/><rect x="433" y="362" width="34" height="38"/>
    <rect x="205" y="428" width="34" height="38"/><rect x="262" y="428" width="34" height="38"/><rect x="319" y="428" width="34" height="38"/><rect x="376" y="428" width="34" height="38"/><rect x="433" y="428" width="34" height="38"/>
  </g>

  <!-- каморка под кровлей -->
  <path d="M330 92 L490 150 L490 176 L330 118 L170 176 L170 150 Z" fill="#8c3a2a" opacity="0.14"/>
  <path d="M330 92 L490 150 L490 176 L330 118 L170 176 L170 150 Z" fill="none" stroke="#8c3a2a" stroke-width="1.6"/>

  <!-- выноски -->
  <line x1="330" y1="130" x2="330" y2="118" stroke="#8c3a2a" stroke-width="1.2"/>
  <circle cx="330" cy="130" r="3" fill="#8c3a2a"/>
  <line x1="336" y1="126" x2="600" y2="126" stroke="#8c3a2a" stroke-width="1"/>
  <text x="606" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8c3a2a">каморка хозяина</text>
  <text x="606" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6f6555">«под самою кровлей»</text>

  <line x1="330" y1="560" x2="330" y2="480" stroke="#2b241c" stroke-width="1"/>
  <text x="330" y="580" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7a6f5e">пятиэтажный дом</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="15.5" fill="#2b241c">
    <text x="530" y="250">«походила более</text>
    <text x="530" y="274">на шкаф, чем</text>
    <text x="530" y="298">на квартиру»</text>
  </g>
  <line x1="524" y1="288" x2="486" y2="300" stroke="#c9a08f" stroke-width="1"/>
  <text x="530" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="1" fill="#7a6f5e">Ч. 1, ГЛ. 1</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#2b241c">
    <text x="530" y="404">До дома процентщицы —</text>
    <text x="530" y="428">семьсот тридцать шагов:</text>
    <text x="530" y="452">он сосчитал их однажды.</text>
  </g>
  <text x="530" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="1" fill="#7a6f5e">Ч. 1, ГЛ. 1</text>

  <path d="M180 480 L480 480" stroke="#2b241c" stroke-width="2"/>
</svg>
