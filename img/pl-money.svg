<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Счёт семьи Раскольниковых: пенсион, долг, взятые вперёд деньги, заложенные часы">
  <rect width="800" height="600" fill="#fbf6ec"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#ded2bd" stroke-width="1.5"/>
  <rect x="27" y="27" width="746" height="546" fill="none" stroke="#ece1cd" stroke-width="1"/>

  <text x="400" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" letter-spacing="4" fill="#2b241c">СЧЁТ СЕМЬИ</text>
  <line x1="336" y1="94" x2="464" y2="94" stroke="#b08a52" stroke-width="1.5"/>

  <!-- линейки, как в конторской книге -->
  <line x1="78" y1="150" x2="722" y2="150" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="78" y1="205" x2="722" y2="205" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="78" y1="260" x2="722" y2="260" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="78" y1="315" x2="722" y2="315" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="78" y1="370" x2="722" y2="370" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="78" y1="425" x2="722" y2="425" stroke="#e3d8c2" stroke-width="1"/>
  <line x1="560" y1="122" x2="560" y2="425" stroke="#c9a08f" stroke-width="1.2"/>
  <line x1="566" y1="122" x2="566" y2="425" stroke="#c9a08f" stroke-width="1.2"/>

  <text x="78" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="2" fill="#8c3a2a">РАСХОД И ДОЛГ</text>
  <text x="722" y="140" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="2" fill="#8c3a2a">РУБЛИ</text>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2b241c">
    <text x="78" y="185">Пенсион матери в год</text>
    <text x="78" y="240">Долг купцу Вахрушину</text>
    <text x="78" y="295">Взято Дуней вперёд у Свидригайловых</text>
    <text x="78" y="350">Отцовские часы в закладе</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#8c3a2a" text-anchor="end">
    <text x="722" y="185">120</text>
    <text x="722" y="240">15</text>
    <text x="722" y="295">100</text>
    <text x="722" y="350">1,15</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7a6f5e">
    <text x="78" y="185" dx="250">в год</text>
    <text x="78" y="240" dx="250">заняла мать</text>
    <text x="78" y="295" dx="250">под вычет из жалованья</text>
    <text x="78" y="350" dx="250">рубль пятнадцать копеек</text>
  </g>

  <line x1="78" y1="425" x2="722" y2="425" stroke="#2b241c" stroke-width="1.4"/>
  <text x="400" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#6f6555">Денег хватает только на то, чтобы считать их.</text>

  <text x="400" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7a6f5e">По письму Пульхерии Александровны (ч. 1, гл. 3) и первой главе романа</text>
</svg>
