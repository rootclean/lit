<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Разрыв: Раскольников просит мать и сестру оставить его">
  <rect width="800" height="600" fill="#fbf6ec"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#ded2bd" stroke-width="1.5"/>
  <rect x="27" y="27" width="746" height="546" fill="none" stroke="#ece1cd" stroke-width="1"/>

  <text x="400" y="74" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="3" fill="#2b241c">РАЗРЫВ</text>
  <line x1="362" y1="92" x2="438" y2="92" stroke="#b08a52" stroke-width="1.5"/>

  <!-- разорванный лист -->
  <g transform="rotate(-1.2 400 320)">
    <path d="M118 158 L392 146 L378 210 L392 268 L372 332 L394 396 L380 462 L118 470 Z" fill="#fffdf6" stroke="#ded2bd" stroke-width="1.4"/>
    <path d="M682 158 L410 146 L424 210 L410 268 L430 332 L408 396 L422 462 L682 470 Z" fill="#fffdf6" stroke="#ded2bd" stroke-width="1.4"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#8c3a2a" text-anchor="middle">
    <text x="400" y="272">Оставьте</text>
    <text x="400" y="314">меня</text>
    <text x="400" y="356">одного!</text>
  </g>

  <text x="400" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-style="italic" fill="#6f6555">Мать и сестра приехали к нему — он просит их уйти.</text>
  <text x="400" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7a6f5e">Ч. 4, ГЛ. 3</text>
</svg>
