<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Схема: связи в семье Раскольниковых и влияние семьи на Родиона">
  <rect width="800" height="600" fill="#fbf6ec"/>
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#ded2bd" stroke-width="1.5"/>
  <rect x="27" y="27" width="746" height="546" fill="none" stroke="#ece1cd" stroke-width="1"/>

  <text x="400" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" letter-spacing="3" fill="#2b241c">СЕМЬЯ И РОДИОН</text>

  <!-- панель 1: связи -->
  <text x="70" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="2" fill="#8c3a2a">ЧТО ДЕРЖАЛО ВМЕСТЕ</text>

  <line x1="180" y1="180" x2="620" y2="180" stroke="#b08a52" stroke-width="2"/>
  <line x1="230" y1="180" x2="350" y2="278" stroke="#b08a52" stroke-width="1.8" stroke-dasharray="7 6"/>
  <line x1="570" y1="180" x2="450" y2="278" stroke="#b08a52" stroke-width="1.8" stroke-dasharray="7 6"/>

  <circle cx="180" cy="180" r="44" fill="#f4ecdc" stroke="#2b241c" stroke-width="1.6"/>
  <circle cx="620" cy="180" r="44" fill="#f4ecdc" stroke="#2b241c" stroke-width="1.6"/>
  <circle cx="400" cy="286" r="44" fill="#f7e6dd" stroke="#8c3a2a" stroke-width="1.8"/>

  <text x="180" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2b241c">Мать</text>
  <text x="620" y="186" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2b241c">Дуня</text>
  <text x="400" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#8c3a2a">Родион</text>

  <text x="400" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#7a6f5e">забота, письма, деньги</text>
  <text x="258" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#7a6f5e">разрыв</text>
  <text x="542" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#7a6f5e">разрыв</text>

  <line x1="672" y1="128" x2="712" y2="128" stroke="#b08a52" stroke-width="2"/>
  <text x="720" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a6f5e">любовь</text>
  <line x1="672" y1="150" x2="712" y2="150" stroke="#b08a52" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="720" y="154" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#7a6f5e">отчуждение</text>

  <line x1="60" y1="356" x2="740" y2="356" stroke="#e3d8c2" stroke-width="1"/>

  <!-- панель 2: влияние -->
  <text x="70" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" letter-spacing="2" fill="#8c3a2a">ЧТО ИЗ ЭТОГО ВЫРОСЛО</text>

  <g>
    <rect x="70" y="418" width="150" height="72" rx="8" fill="#fffdf7" stroke="#ded2bd"/>
    <text x="145" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">жертва</text>
    <text x="145" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">близких</text>

    <rect x="256" y="418" width="150" height="72" rx="8" fill="#fffdf7" stroke="#ded2bd"/>
    <text x="331" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">долг, который</text>
    <text x="331" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">не отдать</text>

    <rect x="442" y="418" width="150" height="72" rx="8" fill="#fffdf7" stroke="#ded2bd"/>
    <text x="517" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">озлобление</text>
    <text x="517" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#2b241c">и разрыв</text>

    <rect x="628" y="418" width="112" height="72" rx="8" fill="#f7e6dd" stroke="#8c3a2a"/>
    <text x="684" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8c3a2a">«право</text>
    <text x="684" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#8c3a2a">имею»</text>
  </g>

  <g stroke="#2b241c" stroke-width="1.4" fill="none">
    <path d="M220 454 h32"/><path d="M246 449 l6 5 l-6 5"/>
    <path d="M406 454 h32"/><path d="M432 449 l6 5 l-6 5"/>
    <path d="M592 454 h32"/><path d="M618 449 l6 5 l-6 5"/>
  </g>

  <text x="400" y="536" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15.5" font-style="italic" fill="#6f6555">Теория выросла не вместо семьи, а из неё: из любви, которую он не смог принять.</text>
</svg>
